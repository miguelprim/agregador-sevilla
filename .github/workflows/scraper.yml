name: Scraper Google Jobs Iglubit

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 08:00 AM (hora España)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que lo ejecutes manualmente cuando quieras con un botón

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar librerías y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Ejecutar Scraper de Google Jobs
        run: python google_jobs.py
